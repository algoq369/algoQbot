<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Council - Multi-AI Consensus System</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg-dark: #1a1a2e;
      --bg-card: #16213e;
      --bg-input: #0f3460;
      --text-primary: #eee;
      --text-secondary: #aaa;
      --claude-color: #9B59B6;
      --deepseek-color: #2ECC71;
      --qwen-color: #3498DB;
      --user-color: #E74C3C;
      --border-color: #333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: var(--bg-card);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .participants {
      display: flex;
      gap: 1rem;
    }

    .participant {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-input);
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .participant.claude { border-left: 3px solid var(--claude-color); }
    .participant.deepseek { border-left: 3px solid var(--deepseek-color); }
    .participant.qwen { border-left: 3px solid var(--qwen-color); }

    /* Main Layout */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Chat Panel */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      padding: 1rem;
      border-radius: 12px;
      background: var(--bg-card);
      max-width: 85%;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-color);
    }

    .message.claude {
      border-left: 4px solid var(--claude-color);
    }

    .message.deepseek {
      border-left: 4px solid var(--deepseek-color);
    }

    .message.qwen {
      border-left: 4px solid var(--qwen-color);
    }

    .message.system {
      align-self: center;
      background: var(--bg-input);
      font-style: italic;
      font-size: 0.9rem;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
    }

    .message-sender {
      font-weight: bold;
    }

    .message-sender.claude { color: var(--claude-color); }
    .message-sender.deepseek { color: var(--deepseek-color); }
    .message-sender.qwen { color: var(--qwen-color); }

    .message-meta {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .message-content {
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message-footer {
      margin-top: 0.5rem;
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Input Area */
    .input-area {
      padding: 1rem;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
    }

    .input-container {
      display: flex;
      gap: 0.5rem;
    }

    .input-container input {
      flex: 1;
      padding: 1rem;
      border: none;
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 1rem;
    }

    .input-container input:focus {
      outline: 2px solid var(--claude-color);
    }

    .input-container button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      background: var(--claude-color);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .input-container button:hover {
      opacity: 0.9;
    }

    .input-container button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Metrics Panel */
    .metrics-panel {
      width: 300px;
      background: var(--bg-card);
      padding: 1rem;
      overflow-y: auto;
    }

    .metrics-section {
      margin-bottom: 1.5rem;
    }

    .metrics-section h3 {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    .metric-value {
      font-weight: bold;
    }

    .consensus-bar {
      height: 8px;
      background: var(--bg-input);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .consensus-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--deepseek-color), var(--claude-color));
      transition: width 0.3s;
    }

    .token-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.25rem 0;
    }

    .token-bar-fill {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: var(--bg-input);
    }

    .token-bar-fill .fill {
      height: 100%;
      border-radius: 3px;
    }

    .token-bar-fill.claude .fill { background: var(--claude-color); }
    .token-bar-fill.deepseek .fill { background: var(--deepseek-color); }
    .token-bar-fill.qwen .fill { background: var(--qwen-color); }

    /* Status Indicator */
    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-input);
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
    }

    .status-dot.connected { background: var(--deepseek-color); }
    .status-dot.deliberating { background: #f39c12; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 1rem;
      align-items: center;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: typing 1s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>🏛️ AI Council</h1>
    <div class="participants">
      <div class="participant claude">🟣 Claude (Architect)</div>
      <div class="participant deepseek">🟢 DeepSeek (Math)</div>
      <div class="participant qwen">🔵 Qwen (Strategy)</div>
    </div>
  </header>

  <main class="main">
    <section class="chat-panel">
      <div class="chat-messages" id="messages">
        <div class="message system">
          Welcome to AI Council. Ask a question and watch Claude, DeepSeek, and Qwen collaborate to find the best answer.
        </div>
      </div>

      <div class="input-area">
        <div class="input-container">
          <input type="text" id="task-input" placeholder="Ask the council a question..." />
          <button id="submit-btn">Ask Council</button>
        </div>
      </div>
    </section>

    <aside class="metrics-panel">
      <div class="status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>

      <div class="metrics-section">
        <h3>Consensus</h3>
        <div class="metric-row">
          <span>Agreement</span>
          <span class="metric-value" id="agreement-score">0%</span>
        </div>
        <div class="consensus-bar">
          <div class="consensus-fill" id="consensus-fill" style="width: 0%"></div>
        </div>
        <div class="metric-row">
          <span>Round</span>
          <span class="metric-value" id="round-number">0 / 3</span>
        </div>
      </div>

      <div class="metrics-section">
        <h3>Token Usage</h3>
        <div class="token-bar">
          <span>🟣</span>
          <div class="token-bar-fill claude"><div class="fill" id="claude-tokens" style="width: 0%"></div></div>
          <span id="claude-token-count">0</span>
        </div>
        <div class="token-bar">
          <span>🟢</span>
          <div class="token-bar-fill deepseek"><div class="fill" id="deepseek-tokens" style="width: 0%"></div></div>
          <span id="deepseek-token-count">0</span>
        </div>
        <div class="token-bar">
          <span>🔵</span>
          <div class="token-bar-fill qwen"><div class="fill" id="qwen-tokens" style="width: 0%"></div></div>
          <span id="qwen-token-count">0</span>
        </div>
      </div>

      <div class="metrics-section">
        <h3>Cost</h3>
        <div class="metric-row">
          <span>Total</span>
          <span class="metric-value" id="total-cost">$0.0000</span>
        </div>
      </div>
    </aside>
  </main>

  <script>
    // Connect to WebSocket server
    const socket = io();

    // DOM elements
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('task-input');
    const submitBtn = document.getElementById('submit-btn');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    // Metrics
    let tokenCounts = { claude: 0, deepseek: 0, qwen: 0 };
    let totalCost = 0;

    // Socket events
    socket.on('connect', () => {
      statusDot.classList.add('connected');
      statusText.textContent = 'Connected';
    });

    socket.on('disconnect', () => {
      statusDot.classList.remove('connected');
      statusText.textContent = 'Disconnected';
    });

    socket.on('welcome', (data) => {
      console.log('Welcome:', data);
    });

    socket.on('council_event', (event) => {
      console.log('Event:', event);

      switch (event.type) {
        case 'status':
          if (event.data.status === 'round_start') {
            document.getElementById('round-number').textContent =
              `${event.data.round} / ${event.data.maxRounds}`;
            statusDot.classList.add('deliberating');
            statusText.textContent = `Round ${event.data.round}...`;
          }
          break;

        case 'message':
          if (event.data.type === 'ai') {
            addMessage(event.data);

            // Update tokens
            if (event.data.tokens) {
              tokenCounts[event.data.provider] += event.data.tokens.total;
              totalCost += event.data.tokens.cost;
              updateMetrics();
            }
          }
          break;

        case 'consensus':
          if (event.data.reached) {
            addSystemMessage(`✅ Consensus reached! Agreement: ${(event.data.score * 100).toFixed(1)}%`);
          } else if (event.data.maxRoundsReached) {
            addSystemMessage(`⚠️ Max rounds reached. Majority: ${event.data.votingResult?.majority.join(', ')}`);
          }
          break;
      }
    });

    socket.on('session_complete', (data) => {
      statusDot.classList.remove('deliberating');
      statusText.textContent = 'Complete';
      submitBtn.disabled = false;

      document.getElementById('agreement-score').textContent =
        `${(data.consensus.score * 100).toFixed(1)}%`;
      document.getElementById('consensus-fill').style.width =
        `${data.consensus.score * 100}%`;
    });

    // Functions
    function addMessage(msg) {
      const div = document.createElement('div');
      div.className = `message ${msg.provider || 'system'}`;

      if (msg.provider) {
        const emoji = msg.provider === 'claude' ? '🟣' :
                      msg.provider === 'deepseek' ? '🟢' : '🔵';
        div.innerHTML = `
          <div class="message-header">
            <span class="message-sender ${msg.provider}">${emoji} ${msg.provider.toUpperCase()}</span>
            <span class="message-meta">Round ${msg.round || 1}</span>
          </div>
          <div class="message-content">${escapeHtml(msg.content)}</div>
          <div class="message-footer">
            ${msg.confidence ? `<span>Confidence: ${msg.confidence}%</span>` : ''}
            ${msg.stance ? `<span>Stance: ${msg.stance}</span>` : ''}
            ${msg.tokens ? `<span>Tokens: ${msg.tokens.total}</span>` : ''}
          </div>
        `;
      } else {
        div.innerHTML = `<div class="message-content">${escapeHtml(msg.content)}</div>`;
      }

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'message system';
      div.innerHTML = `<div class="message-content">${text}</div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addUserMessage(text) {
      const div = document.createElement('div');
      div.className = 'message user';
      div.innerHTML = `
        <div class="message-header">
          <span class="message-sender">👤 You</span>
        </div>
        <div class="message-content">${escapeHtml(text)}</div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function updateMetrics() {
      const maxTokens = Math.max(...Object.values(tokenCounts), 1);

      ['claude', 'deepseek', 'qwen'].forEach(ai => {
        document.getElementById(`${ai}-tokens`).style.width =
          `${(tokenCounts[ai] / maxTokens) * 100}%`;
        document.getElementById(`${ai}-token-count`).textContent = tokenCounts[ai];
      });

      document.getElementById('total-cost').textContent = `$${totalCost.toFixed(4)}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Submit handler
    submitBtn.addEventListener('click', () => {
      const task = inputEl.value.trim();
      if (!task) return;

      addUserMessage(task);
      inputEl.value = '';
      submitBtn.disabled = true;

      // Reset metrics
      tokenCounts = { claude: 0, deepseek: 0, qwen: 0 };
      totalCost = 0;
      updateMetrics();

      socket.emit('start_session', { task });
    });

    inputEl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        submitBtn.click();
      }
    });
  </script>
</body>
</html>
